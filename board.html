<!DOCTYPE html>
<html lang="en-AU" data-theme="studio">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Built for Samsung Tizen 4.0 (Chromium 56) as well as modern browsers.
   That means no CSS Grid, no clamp(), no flex gap. Layout is flexbox and
   absolute positioning; sizes scale through two variables the script sets
   at runtime: --hscale from viewport width, --scale from column width. */

:root {
  /* Light theme (default). Change data-theme on the <html> tag to "dark". */
  --ink:        #F5F2EB;
  --panel:      #FFFFFF;
  --panel-lift: #FFF8E6;
  --line:       #D9D2C4;
  --block-line: #E4DED1;
  --chalk:      #1B222E;
  --body:       #414B5A;
  --muted:      #5F6A7B;
  --brass:      #7E590D;
  --accent:     #1F5E5B;
  --rose:       #B23B34;
  --amber:      #A96410;
  --band:       #E8E4DA;

  --rail: 88px;
  --scale: 1;
  --hscale: 1;
  --masthead: 90px;
}

/* Studio colours: cooler ground, white cards, a hue per studio. Venue
   colours themselves live in VENUE_PALETTES in the script. */
[data-theme="studio"] {
  --ink:        #EDF0F4;
  --panel:      #FFFFFF;
  --panel-lift: #FFF9EE;
  --line:       #D3D9E2;
  --block-line: #E2E6EC;
  --chalk:      #1B222E;
  --body:       #414B5A;
  --muted:      #5F6A7B;
  --brass:      #A8511E;
  --accent:     #3A4657;
  --rose:       #993556;
  --amber:      #854F0B;
  --band:       #E2E6ED;
}

[data-theme="dark"] {
  --ink:        #0B1018;
  --panel:      #1A2337;
  --panel-lift: #26334F;
  --line:       #303D5C;
  --block-line: transparent;
  --chalk:      #FFFFFF;
  --body:       #DDE4F0;
  --muted:      #9AA6BF;
  --brass:      #E3B84F;
  --accent:     #6FB2AC;
  --rose:       #E8867C;
  --amber:      #F0A24A;
  --band:       #161D2C;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--ink);
  color: var(--chalk);
  font-family: "IBM Plex Sans", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ---------------------------------------------------------------- header */

.masthead {
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: baseline;
  align-items: baseline;
  padding: 18px 30px 14px;
  border-bottom: 2px solid var(--line);
}

.eyebrow {
  font-family: "IBM Plex Mono", monospace;
  font-size: calc(13px * var(--hscale));
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
  white-space: nowrap;
  margin-right: 28px;
}

.today {
  font-family: "Fraunces", Georgia, serif;
  font-weight: 500;
  font-size: calc(36px * var(--hscale));
  letter-spacing: -0.015em;
  margin: 0;
  -webkit-flex: 1 1 auto;
  flex: 1 1 auto;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.clock {
  font-family: "IBM Plex Mono", monospace;
  font-size: calc(38px * var(--hscale));
  font-weight: 600;
  color: var(--brass);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  margin-left: 24px;
}

.status-line {
  position: fixed;
  right: 14px;
  bottom: 8px;
  font-family: "IBM Plex Mono", monospace;
  font-size: calc(11px * var(--hscale));
  letter-spacing: 0.08em;
  color: var(--muted);
  opacity: 0.7;
  z-index: 6;
}

/* ------------------------------------------------------------ grid view */

.board {
  padding: 0 30px 14px;
  height: calc(100% - var(--masthead) - var(--later, 0px));
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-flex-direction: column;
  flex-direction: column;
}

.headrow,
.tracks {
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-flex-direction: row;
  flex-direction: row;
}

.headrow {
  border-bottom: 2px solid var(--line);
  -webkit-flex: 0 0 auto;
  flex: 0 0 auto;
}

.headrow > .spacer,
.tracks > .rail {
  -webkit-flex: 0 0 var(--rail);
  flex: 0 0 var(--rail);
  width: var(--rail);
}

.headrow > .venue,
.tracks > .track {
  -webkit-flex: 1 1 0;
  flex: 1 1 0;
  min-width: 0;
  margin-left: 10px;
}

.venue {
  font-family: "IBM Plex Mono", monospace;
  font-size: calc(15px * var(--scale));
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--venue-fg, var(--accent));
  background: var(--venue-bg, transparent);
  border-radius: 6px;
  padding: 10px 10px 9px;
  margin-bottom: 8px;
  line-height: 1.25;
}

.tracks {
  position: relative;
  -webkit-flex: 1 1 auto;
  flex: 1 1 auto;
  min-height: 0;
}

.rail { position: relative; }

.tick {
  position: absolute;
  left: 0;
  right: 12px;
  font-family: "IBM Plex Mono", monospace;
  font-size: calc(17px * var(--scale));
  font-weight: 600;
  color: var(--muted);
  text-align: right;
  -webkit-transform: translateY(-0.55em);
  transform: translateY(-0.55em);
  font-variant-numeric: tabular-nums;
}

.track {
  position: relative;
  border-left: 2px solid var(--line);
}

.hairline {
  position: absolute;
  left: var(--rail);
  right: 0;
  height: 1px;
  background: var(--line);
  pointer-events: none;
  z-index: 0;
}

/* ------------------------------------------------------ activity blocks */

.block {
  position: absolute;
  background: var(--panel);
  border-radius: 4px;
  border: 1px solid var(--block-line);
  border-left: 5px solid var(--venue-edge, transparent);
  padding: 8px 11px;
  overflow: hidden;
  z-index: 1;
}

.block .when {
  font-family: "IBM Plex Mono", monospace;
  font-size: calc(15px * var(--scale));
  font-weight: 600;
  color: var(--venue-fg, var(--brass));
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
}

.block .what {
  font-size: calc(22px * var(--scale));
  font-weight: 700;
  line-height: 1.15;
  margin-top: 0.15em;
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.block .detail {
  font-size: calc(16.5px * var(--scale));
  font-weight: 500;
  color: var(--body);
  line-height: 1.2;
  margin-top: 0.2em;
}

.block .who {
  font-size: calc(15px * var(--scale));
  font-weight: 500;
  color: var(--muted);
  line-height: 1.2;
  margin-top: 0.2em;
}

.block .cast {
  font-size: calc(16px * var(--scale));
  font-weight: 500;
  font-style: italic;
  color: var(--muted);
  line-height: 1.25;
  margin-top: 0.25em;
}

.block .cast .more {
  color: var(--brass);
  font-weight: 600;
  font-style: normal;
  white-space: nowrap;
}

/* Short bookings shed lines from the bottom up rather than clipping text
   mid-word. Dancer lists go first, then staff, then notes. */
.block.tight .what { -webkit-line-clamp: 3; }
.block.tight .cast { display: none; }

.block.tighter .what { -webkit-line-clamp: 2; }
.block.tighter .cast,
.block.tighter .who,
.block.tighter .detail { display: none; }

.block.tightest {
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-align-items: baseline;
  align-items: baseline;
  padding-top: 4px;
  padding-bottom: 4px;
}
.block.tightest .when {
  -webkit-flex: 0 0 auto;
  flex: 0 0 auto;
  white-space: nowrap;
  margin-right: 8px;
}
.block.tightest .what {
  display: block;
  font-size: calc(19px * var(--scale));
  margin-top: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.block.tightest .detail,
.block.tightest .who,
.block.tightest .cast,
.block.tightest .flag { display: none; }

/* An absence band: present but quiet, and behind everything real. */
.block.is-background {
  background: var(--band, rgba(0, 0, 0, 0.045));
  border: none;
  border-radius: 3px;
  padding: 5px 8px;
  z-index: 0;
  opacity: 1;
}

.block.is-background .band-label {
  font-family: "IBM Plex Mono", monospace;
  font-size: calc(12px * var(--scale));
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  opacity: 0.65;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.block.is-past { opacity: 0.45; }

.block.is-live {
  background: var(--panel-lift);
  border-color: var(--brass);
  border-left-color: var(--brass);
}

.block.is-cancelled { border-left-color: var(--rose); }
.block.is-cancelled .what { text-decoration: line-through; }
.block.is-updated { border-left-color: var(--amber); }

.flag {
  display: inline-block;
  font-family: "IBM Plex Mono", monospace;
  font-size: calc(12px * var(--scale));
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 1px 5px;
  border-radius: 3px;
  color: var(--ink);
}

.flag.cancelled { background: var(--rose); }
.flag.updated { background: var(--amber); }

/* -------------------------------------------------------- the now line */

.now {
  position: absolute;
  left: 0;
  right: 0;
  height: 0;
  border-top: 3px solid var(--brass);
  z-index: 3;
  pointer-events: none;
}

.now .now-time {
  position: absolute;
  left: 0;
  top: -0.85em;
  width: calc(var(--rail) - 12px);
  text-align: center;
  font-family: "IBM Plex Mono", monospace;
  font-size: calc(17px * var(--scale));
  font-weight: 600;
  color: var(--ink);
  background: var(--brass);
  border-radius: 3px;
  padding: 1px 0;
  font-variant-numeric: tabular-nums;
}

/* --------------------------------------------- calls after the cut-off */

.later {
  display: none;
  border-top: 2px solid var(--line);
  margin: 0 30px;
  padding: 10px 0 12px;
  font-family: "IBM Plex Mono", monospace;
  font-size: calc(15px * var(--scale));
  line-height: 1.5;
  color: var(--body);
}

.later.has-items { display: block; }

.later .later-label {
  color: var(--accent);
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-right: 14px;
}

.later .later-item { margin-right: 22px; white-space: nowrap; }
.later .later-when { color: var(--brass); font-weight: 600; }
.later .later-where { color: var(--muted); }

/* ------------------------------------------------------- empty / error */

.notice {
  padding: 10vh 40px;
  text-align: center;
  color: var(--muted);
  font-size: calc(20px * var(--hscale));
  line-height: 1.6;
}

.notice strong {
  display: block;
  color: var(--chalk);
  font-family: "Fraunces", Georgia, serif;
  font-weight: 500;
  font-size: calc(34px * var(--hscale));
  margin-bottom: 0.4em;
}

/* -------------------------------------------------------- agenda (phone) */

.agenda { display: none; }

@media (max-width: 820px) {
  html, body { overflow: auto; height: auto; }
  .board { display: none; }
  .status-line { position: static; display: block; padding: 12px 20px 30px; }

  .agenda { display: block; padding: 0 20px 40px; }

  .agenda-item {
    display: -webkit-flex;
    display: flex;
    padding: 15px 0;
    border-bottom: 1px solid var(--line);
  }
  .agenda-item.is-past { opacity: 0.45; }
  .agenda-item.is-live {
    border-left: 4px solid var(--brass);
    padding-left: 12px;
    margin-left: -16px;
  }
  .agenda-time {
    -webkit-flex: 0 0 66px;
    flex: 0 0 66px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 14px;
    font-weight: 600;
    color: var(--brass);
    line-height: 1.5;
    font-variant-numeric: tabular-nums;
  }
  .agenda-body { -webkit-flex: 1 1 auto; flex: 1 1 auto; min-width: 0; }
  .agenda-venue {
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--venue-fg, var(--muted));
    background: var(--venue-bg, transparent);
    border-radius: 4px;
    padding: 2px 6px;
    display: inline-block;
    margin-bottom: 5px;
  }
  .agenda-what { font-size: 17px; font-weight: 700; line-height: 1.25; }
  .agenda-item.is-cancelled .agenda-what { text-decoration: line-through; }
  .agenda-detail { font-size: 14px; color: var(--body); margin-top: 3px; }
  .agenda-who { font-size: 13.5px; color: var(--muted); margin-top: 3px; }
  .agenda-cast {
    font-size: 13px;
    font-style: italic;
    color: var(--muted);
    opacity: 0.85;
    margin-top: 2px;
  }
  .masthead { -webkit-flex-wrap: wrap; flex-wrap: wrap; }
  .eyebrow { width: 100%; margin-bottom: 6px; }
}
</style>
</head>
<body>

<header class="masthead" id="masthead">
  <div class="eyebrow" id="eyebrow">Studio schedule</div>
  <h1 class="today" id="today">Loading&hellip;</h1>
  <div class="clock" id="clock">--:--</div>
</header>

<div class="board" id="board"></div>
<div class="later" id="later"></div>
<div class="agenda" id="agenda"></div>
<div class="status-line" id="status">Fetching schedule</div>

<script>
/* =====================================================================
   Configuration
   ===================================================================== */

/* One page serves every board. What it shows is chosen by its own URL, so
   there is only ever one copy of this file to maintain:

     /                          the studios board
     /?report=calendar          another report registered in the proxy
     /?report=calendar&title=Production+calendar&end=22

   Supported settings: report, title, theme, start, end.
   Anything not given falls back to the defaults further down. */
function query() {
  const out = {};
  const raw = window.location.search.replace(/^\?/, "");
  if (!raw) return out;
  const parts = raw.split("&");
  for (let i = 0; i < parts.length; i++) {
    const bit = parts[i].split("=");
    if (!bit[0]) continue;
    out[decodeURIComponent(bit[0])] =
      decodeURIComponent((bit[1] || "").replace(/\+/g, " "));
  }
  return out;
}

const QS = query();

/* An hour setting from the URL: a number, or "none" for no limit. */
function hourSetting(value, fallback) {
  if (value === undefined) return fallback;
  if (value === "" || value === "none" || value === "null") return null;
  const n = Number(value);
  return isFinite(n) ? n : fallback;
}

if (QS.theme) document.documentElement.setAttribute("data-theme", QS.theme);

/* The proxy is asked for whichever report this page's URL names. */
const PROXY_URL = "/schedule" + window.location.search;
const REFRESH_SECONDS = 60;

/* A screen on a wall has no console. If the script dies, say so on the
   screen rather than sitting on "Loading" forever - that failure cost a
   fortnight of guesswork once already. */
window.onerror = function (message, source, line) {
  var today = document.getElementById("today");
  var board = document.getElementById("board");
  if (today) today.textContent = "Display error";
  if (board) {
    board.innerHTML = '<div class="notice"><strong>The page hit an error.</strong>' +
      escapeHtml(String(message)) + "<br>line " + line + "</div>";
  }
  setStatus("Script error");
  return false;
};

/* And if it neither renders nor errors within half a minute - a request
   that hangs rather than fails - say that too. */
setTimeout(function () {
  if (!model) {
    var today = document.getElementById("today");
    if (today && today.textContent === "Loading\u2026") {
      today.textContent = "No response";
      document.getElementById("board").innerHTML =
        '<div class="notice"><strong>No answer from the schedule.</strong>' +
        "The request was sent but nothing came back. Still retrying.</div>";
    }
  }
}, 30000);

/* =====================================================================
   Parsing the DIESE report
   ===================================================================== */

function textLines(el) {
  const html = el.innerHTML
    .replace(/<br\s*\/?>/gi, "\n")
    .replace(/<\/(p|div)>/gi, "\n");
  const scratch = document.createElement("div");
  scratch.innerHTML = html;
  return (scratch.textContent || "")
    .replace(/\u00a0/g, " ")
    .split("\n")
    .map(function (line) { return line.trim(); })
    .filter(Boolean);
}

function clean(value) {
  // Strip the separator dots the report leaves behind and tidy whitespace.
  return String(value)
    .replace(/\u00a0/g, " ")
    .replace(/\s+/g, " ")
    .replace(/^[\s\u00b7.\u2013\u2014-]+|[\s\u00b7.]+$/g, "")
    .trim();
}

function parseClock(value) {
  const match = /^(\d{1,2}):(\d{2})$/.exec(value);
  if (!match) return null;
  return parseInt(match[1], 10) * 60 + parseInt(match[2], 10);
}

function parseReport(html) {
  const doc = new DOMParser().parseFromString(html, "text/html");

  const heading = doc.querySelector(".mainTable_header th");
  const dateLabel = heading ? heading.textContent.split("|")[0].trim() : "";

  const venues = Array.prototype.slice
    .call(doc.querySelectorAll(".activitiesTable thead th"))
    .slice(1)
    .map(function (th) { return th.textContent.trim(); });

  const seen = Object.create(null);
  const activities = [];

  doc.querySelectorAll("tr.planning_hours").forEach(function (row) {
    row.querySelectorAll("td.activities").forEach(function (cell, columnIndex) {
      cell.querySelectorAll(".activity").forEach(function (node) {
        const info = node.querySelector(".info_content");
        if (!info) return;

        const lines = textLines(info);
        if (!lines.length) return;

        // The report has used two layouts: the time on a line of its own,
        // and the time run together with the title on one line. Search
        // anywhere in the line rather than anchoring, and accept a hyphen,
        // en dash or em dash with or without surrounding spaces.
        const TIME_RANGE =
          /(\d{1,2}:\d{2})\s*[\u2013\u2014\u2212-]\s*(\d{1,2}:\d{2})/;

        let startMin = null, endMin = null, rangeIndex = -1, trailing = "";
        for (let i = 0; i < lines.length; i++) {
          const range = TIME_RANGE.exec(lines[i]);
          if (range) {
            startMin = parseClock(range[1]);
            endMin = parseClock(range[2]);
            rangeIndex = i;
            trailing = lines[i].slice(range.index + range[0].length);
            break;
          }
        }
        if (startMin === null || endMin === null) return;
        if (endMin <= startMin) endMin = startMin + 30;

        // Names in italics: the first group is the staff taking the call,
        // any further groups are the dancers.
        // Keep the groups in position: an empty first group means the call
        // has no staff listed, not that the dancers are staff.
        const emParts = Array.prototype.slice
          .call(info.querySelectorAll("em"))
          .map(function (em) { return clean(em.textContent); });

        const staffText = emParts.length ? emParts[0] : "";
        const castText = emParts.slice(1).filter(Boolean).join(", ");

        // Whatever followed the time on the same line is the title. If the
        // time stood alone, fall back to the next line that isn't a name list.
        let heading = clean(trailing);
        if (!heading) {
          for (let i = rangeIndex + 1; i < lines.length; i++) {
            const candidate = clean(lines[i]);
            if (candidate && emParts.indexOf(candidate) === -1 &&
                !TIME_RANGE.test(candidate)) {
              heading = candidate;
              break;
            }
          }
        }

        // DIESE uses a pipe to hang notes off the end of a call name.
        const segments = heading.split("|").map(clean).filter(Boolean);

        // Anything else left on its own line is a note too, so lines like
        // "Studio Available As Required" survive.
        const extras = [];
        for (let i = rangeIndex; i < lines.length; i++) {
          const candidate = clean(lines[i]);
          if (!candidate) continue;
          if (candidate === heading) continue;
          if (emParts.indexOf(candidate) !== -1) continue;
          if (TIME_RANGE.test(candidate)) continue;
          if (heading.indexOf(candidate) !== -1) continue;
          extras.push(candidate);
        }

        const statusNode = node.querySelector(".activity_message div");
        const statusClass = statusNode ? statusNode.className.toLowerCase() : "";

        const activity = {
          venue: venues[columnIndex] || "Unknown studio",
          venueIndex: columnIndex,
          startMin: startMin,
          endMin: endMin,
          title: segments[0] || "Untitled activity",
          detail: segments.slice(1).concat(extras).join(" \u00b7 "),
          staff: staffText,
          cast: castText,
          cancelled: statusClass.indexOf("cancelled") !== -1,
          updated: statusClass.indexOf("updated") !== -1
        };
        activity.background = BACKGROUND_TITLES.test(activity.title);

        const key = [activity.venue, startMin, endMin, activity.title].join("|");
        if (seen[key]) return;
        seen[key] = true;
        activities.push(activity);
      });
    });
  });

  return { dateLabel: dateLabel, venues: venues, activities: activities };
}

/* =====================================================================
   Layout maths
   ===================================================================== */

let spareUsed = {};

function venueColour(name) {
  const theme = document.documentElement.getAttribute("data-theme");
  if (!THEMES_WITH_VENUE_COLOUR[theme]) return null;

  for (let i = 0; i < VENUE_GROUPS.length; i++) {
    if (VENUE_GROUPS[i].match.test(name)) return VENUE_GROUPS[i];
  }
  // Unnamed studio: hand out spare hues in the order they appear, and
  // remember the choice so it doesn't change on the next refresh.
  if (!(name in spareUsed)) {
    spareUsed[name] = VENUE_SPARE[Object.keys(spareUsed).length % VENUE_SPARE.length];
  }
  return spareUsed[name];
}

function venueVars(name) {
  const c = venueColour(name);
  if (!c) return "";
  return "--venue-fg:" + c.fg + ";--venue-bg:" + c.bg + ";--venue-edge:" + c.edge + ";";
}

function blockVars(name) {
  const c = venueColour(name);
  if (!c) return "";
  return "--venue-fg:" + c.fg + ";--venue-edge:" + c.edge + ";";
}

function pad(n) {
  // Not String.padStart - that arrived in Chromium 57 and the Tizen
  // players run 56.
  n = String(n);
  return n.length >= 2 ? n : "0" + n;
}
function asClock(m) { return pad(Math.floor(m / 60)) + ":" + pad(m % 60); }
function nowMinutes() {
  const d = new Date();
  return d.getHours() * 60 + d.getMinutes();
}

let model = null;
let lastUpdated = null;
let windowStart = 8 * 60;
let windowEnd = 22 * 60;
let pxPerMin = 1;

/* The timeline no longer runs at a constant rate. Minutes where nothing
   changes are compressed; minutes where calls start and finish keep their
   room. That is what lets a whole twelve-hour day fit on one screen with
   short calls still legible. cuts[] holds the minute of each breakpoint
   and offsets[] the pixel position of each. */
let cuts = [];
let offsets = [];
let mapSqueezed = false;
let narrowed = false;
let trackHeight = 600;
let scale = 1;

/* The column a booking sits in is what limits how big its text can be,
   so type is scaled against measured column width, not viewport width.
   440px is the reference: four studios across a 1080p screen. */
const REFERENCE_COLUMN = 440;

/* How dancer names are shown:
     "fit"   - as many whole names as the block holds, then "+N more"
     "count" - just the number, e.g. "23 dancers"
     "off"   - not shown at all
   With many studio columns, "count" is often the honest choice: a list
   that long cannot be legible from across a room at any size. */
const CAST_MODE = "fit";

/* Rolling window. Set WINDOW_HOURS to 0 to show the entire day instead. */
/* The whole day is shown by default, and the variable-rate timeline
   usually makes that fit. On a day too long or too crowded to fit while
   keeping calls legible, the board narrows to WINDOW_HOURS around now
   rather than shrinking everything past reading. Set AUTO_NARROW to false
   to always show the whole day, or FOLLOW_NOW to true to always narrow. */
const FOLLOW_NOW = false;
const AUTO_NARROW = true;
const WINDOW_HOURS = 6;

/* The timeline stops here, so the evening tail doesn't eat the height the
   working day needs. Anything starting later is still shown, listed along
   the bottom instead of drawn. Set to null for no cap. The cap lifts by
   itself once the current time reaches it, so an evening never disappears
   while it is happening. */
/* A hue per studio, so a column is found by colour before it is read.
   Colours are keyed to the studio NAME, not the column position, so a
   studio keeps its colour on days when others drop out of the report.
   Grouped by building area: everything Zambelli shares one hue, all of
   Helpmann and Van Praagh another. Only used by the "studio" theme. */
const VENUE_GROUPS = [
  { match: /zambelli/i,            fg: "#0F6E56", bg: "#E1F5EE", edge: "#1D9E75" },
  { match: /helpmann|van praagh/i, fg: "#534AB7", bg: "#EEEDFE", edge: "#7F77DD" },
  { match: /williams/i,            fg: "#3B6D11", bg: "#EAF3DE", edge: "#639922" },
  { match: /albert/i,              fg: "#993C1D", bg: "#FAECE7", edge: "#D85A30" }
];

/* For columns the list above doesn't name - which is every column on a
   board whose headings are people rather than studios. Handed out in the
   order columns appear, so nine practitioners get nine distinct hues. */
const VENUE_SPARE = [
  { fg: "#185FA5", bg: "#E6F1FB", edge: "#378ADD" },
  { fg: "#0F6E56", bg: "#E1F5EE", edge: "#1D9E75" },
  { fg: "#993556", bg: "#FBEAF0", edge: "#D4537E" },
  { fg: "#854F0B", bg: "#FAEEDA", edge: "#EF9F27" },
  { fg: "#534AB7", bg: "#EEEDFE", edge: "#7F77DD" },
  { fg: "#3B6D11", bg: "#EAF3DE", edge: "#639922" },
  { fg: "#993C1D", bg: "#FAECE7", edge: "#D85A30" },
  { fg: "#1C6068", bg: "#E3F3F5", edge: "#2E97A3" },
  { fg: "#6A4A9E", bg: "#F1EBFB", edge: "#9B78D4" }
];

const THEMES_WITH_VENUE_COLOUR = { studio: true };

/* Entries that describe absence rather than an appointment. The health
   report fills empty time with "Not Available", often spanning 00:00-23:59,
   so these are drawn as quiet background bands and are ignored when working
   out the day's span, the lane layout and the minimum block height. */
const BACKGROUND_TITLES = /^(not available|unavailable|no availability)$/i;

/* ?names=off hides the person attached to each entry. On a board showing
   who is seeing which practitioner, that is the difference between a
   timetable and a medical record on a wall. */
const SHOW_NAMES = QS.names !== "off";

/* Where the drawn timeline starts and stops. null means "follow the
   day's own first and last call". A call that merely runs past the end is
   still drawn, clipped at the edge, with its real finish time in its text;
   only one starting entirely beyond it moves to the strip along the
   bottom, and even then LOOK_AHEAD_MINUTES pulls it in as it approaches. */
const DAY_START_HOUR = hourSetting(QS.start, null);
const DAY_END_HOUR = hourSetting(QS.end, 19);

/* A late call joins the drawn timeline once it is this close, instead of
   waiting for the clock to pass the cap. With an 18:00 cap and 90 minutes'
   notice, an 18:30 class appears on the board at 17:00 and the timeline
   grows to fit it, rather than sitting in small type at the bottom until
   the moment it starts. */
const LOOK_AHEAD_MINUTES = 90;

/* How far back the window reaches. This also fixes where the current-time
   line sits: LOOK_BACK_MINUTES / (WINDOW_HOURS * 60) of the way down. At
   30 minutes in a 6 hour window that is about a twelfth from the top,
   leaving the rest of the screen for what is still to come. Raise it to
   see more of what has just finished. */
const LOOK_BACK_MINUTES = 30;
const MIN_SCALE = 0.62;
const MAX_SCALE = 1.45;

/* Overlapping bookings in one studio sit side by side rather than on top
   of each other. Each gets a lane; the venue's lane count sets the width. */
function assignLanes(list) {
  const laneEnds = [];
  const laneMembers = [];
  const ordered = list.slice().sort(function (a, b) {
    return a.startMin - b.startMin || a.endMin - b.endMin;
  });

  ordered.forEach(function (a) {
    let lane = 0;
    while (lane < laneEnds.length && laneEnds[lane] > a.startMin) lane++;
    laneEnds[lane] = a.endMin;
    a.lane = lane;
    (laneMembers[lane] = laneMembers[lane] || []).push(a);
  });

  // Record where the next booking in the same lane begins, so a block can
  // be given a minimum height without ever running into it.
  laneMembers.forEach(function (members) {
    members.forEach(function (a, i) {
      a.nextInLane = i + 1 < members.length ? members[i + 1].startMin : null;
    });
  });

  list.forEach(function (a) { a.lanes = Math.max(laneEnds.length, 1); });
}

function measure() {
  const masthead = document.getElementById("masthead");
  document.documentElement.style.setProperty(
    "--masthead", masthead.offsetHeight + "px"
  );
  const tracks = document.querySelector(".tracks");
  if (tracks) {
    trackHeight = tracks.clientHeight;
    pxPerMin = trackHeight / Math.max(windowEnd - windowStart, 60);
  }
  // Header type scales with viewport width; block type scales with column
  // width. Both were clamp() expressions before.
  const hscale = Math.min(1.5, Math.max(0.78, window.innerWidth / 1600));
  document.documentElement.style.setProperty("--hscale", hscale.toFixed(3));

  const later = document.getElementById("later");
  document.documentElement.style.setProperty(
    "--later", (later ? later.offsetHeight : 0) + "px");

  const firstTrack = document.querySelector(".track");
  if (firstTrack && firstTrack.clientWidth) {
    scale = Math.min(
      MAX_SCALE,
      Math.max(MIN_SCALE, firstTrack.clientWidth / REFERENCE_COLUMN)
    );
    document.documentElement.style.setProperty("--scale", scale.toFixed(3));
  }
}

/* =====================================================================
   Rendering
   ===================================================================== */

function stateFor(a) {
  const now = nowMinutes();
  let cls = a.updated ? " is-updated" : "";
  if (a.cancelled) return "is-cancelled" + cls;
  if (now >= a.endMin) return "is-past" + cls;
  if (now >= a.startMin) return "is-live" + cls;
  return cls.trim();
}

function densityFor(height) {
  // One "unit" is roughly the height of a title line at the current scale,
  // so a block is judged by how many lines it can actually hold rather
  // than by a fixed pixel count.
  const unit = 26 * scale;
  if (height < 2.1 * unit) return " tightest";
  if (height < 3.4 * unit) return " tighter";
  if (height < 5.0 * unit) return " tight";
  return "";
}

function escapeHtml(v) {
  return String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function castNames(a) {
  return a.cast ? a.cast.split(", ").filter(Boolean) : [];
}

function castHtml(a) {
  const names = castNames(a);
  if (!names.length || CAST_MODE === "off") return "";

  if (CAST_MODE === "count") {
    return '<div class="cast">' + names.length +
      (names.length === 1 ? " dancer" : " dancers") + "</div>";
  }

  // Full list up front; fitCast trims it to whole names once the browser
  // has laid the block out and we can see what actually fits.
  return '<div class="cast" data-names="' + escapeAttr(a.cast) + '">' +
    escapeHtml(a.cast) + "</div>";
}

/* Trim each cast list to the largest number of whole names the block can
   hold, then say how many are hidden. Runs after layout, so it needs real
   measurements - it no-ops where there are none. */
function fitCast() {
  if (CAST_MODE !== "fit") return;

  const casts = document.querySelectorAll(".block .cast");
  for (let i = 0; i < casts.length; i++) {
    const el = casts[i];
    const block = el.parentNode;
    const raw = el.getAttribute("data-names");
    if (!raw) continue;
    if (!block.clientHeight) continue;

    const names = raw.split(", ").filter(Boolean);

    const show = function (n) {
      if (n >= names.length) {
        el.innerHTML = escapeHtml(names.join(", "));
      } else if (n <= 0) {
        el.innerHTML = '<span class="more">' + names.length + " dancers</span>";
      } else {
        el.innerHTML = escapeHtml(names.slice(0, n).join(", ")) +
          ' <span class="more">+' + (names.length - n) + "</span>";
      }
    };

    show(names.length);
    if (block.scrollHeight <= block.clientHeight) continue;

    // Largest count that still fits, by bisection.
    let lo = 0, hi = names.length - 1;
    while (lo < hi) {
      const mid = Math.ceil((lo + hi) / 2);
      show(mid);
      if (block.scrollHeight <= block.clientHeight) lo = mid;
      else hi = mid - 1;
    }
    show(lo);

    // If even the bare count overflows, the block is too small for it.
    if (block.scrollHeight > block.clientHeight) el.style.display = "none";
  }
}

function escapeAttr(value) {
  return escapeHtml(value).replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function flagHtml(a) {
  if (a.cancelled) return '<span class="flag cancelled">Cancelled</span>';
  if (a.updated) return '<span class="flag updated">Updated</span>';
  return "";
}

function buildShell() {
  document.getElementById("today").textContent = model.dateLabel || "Today";
  document.documentElement.style.setProperty("--cols", model.venues.length);

  let html = '<div class="headrow" id="headrow"><div class="spacer"></div>';
  model.venues.forEach(function (v) {
    html += '<div class="venue" style="' + venueVars(v) + '">' +
      escapeHtml(v) + "</div>";
  });
  html += '</div><div class="tracks" id="tracks"><div class="rail" id="rail"></div>';
  model.venues.forEach(function () { html += '<div class="track"></div>'; });
  html += '<div class="now" id="nowline" hidden>' +
    '<span class="now-time" id="nowtime"></span></div></div>';

  document.getElementById("board").innerHTML = html;
}

/* The visible slice of the day. With FOLLOW_NOW on, the board shows a
   rolling window around the current time instead of the whole day, which
   is what gives short bookings enough height to be readable. Set
   WINDOW_HOURS to 0 to go back to showing everything. */
function computeWindow(useWindow) {
  // Background bands don't define the day - a "Not Available" running
  // 00:00-23:59 would otherwise stretch the timeline across midnight.
  const real = model.activities.filter(function (a) { return !a.background; });
  const basis = real.length ? real : model.activities;

  let dayStart = Math.floor(Math.min.apply(null,
    basis.map(function (a) { return a.startMin; })) / 60) * 60;

  if (DAY_START_HOUR !== null) {
    dayStart = Math.max(dayStart, DAY_START_HOUR * 60);
  }
  let dayEnd = Math.ceil(Math.max.apply(null,
    basis.map(function (a) { return a.endMin; })) / 60) * 60;

  if (DAY_END_HOUR !== null) {
    const cap = DAY_END_HOUR * 60;
    const horizon = nowMinutes() + LOOK_AHEAD_MINUTES;

    // Start at the cap, then stretch it to cover any late call now close
    // enough to matter. Only calls that START after the cap count - one
    // that began earlier and runs past it is already drawn, clipped at the
    // edge, with its real finish time in the text.
    let visibleEnd = cap;
    basis.forEach(function (a) {
      if (a.startMin >= cap && a.startMin <= horizon) {
        visibleEnd = Math.max(visibleEnd, Math.ceil(a.endMin / 60) * 60);
      }
    });

    // Never cap so tightly that there is no day left to show.
    if (cap > dayStart + 180) {
      dayEnd = Math.min(dayEnd, Math.max(cap, visibleEnd));
    }
  }

  const span = WINDOW_HOURS * 60;

  if (!useWindow || !span || dayEnd - dayStart <= span) {
    windowStart = dayStart;
    windowEnd = Math.max(dayEnd, dayStart + 240);
    return;
  }

  // Anchored to the actual time, not the hour boundary. Rounding down to
  // the hour made the now-line slide down the screen as the hour passed,
  // then snap back at the top of the next one. Rounded to 5 minutes so the
  // board is not nudging itself every thirty seconds.
  let from = Math.round((nowMinutes() - LOOK_BACK_MINUTES) / 5) * 5;
  from = Math.max(dayStart, Math.min(from, dayEnd - span));
  windowStart = from;
  windowEnd = from + span;
}

/* The height every activity is guaranteed, in title-line units, so it
   follows the type scale. The variable-rate timeline takes the room from
   wherever there is slack. At 4.6 a half-hour call holds its time, a
   three-line title and the staff names; the day stops fitting somewhere
   around 7, at which point the board narrows itself instead. */
const MIN_BLOCK_UNITS = (function () {
  const n = Number(QS.min);
  return isFinite(n) && n > 0 ? n : 4.6;
})();
const MIN_SLICE_PX = 6;

function buildTimeMap(available) {
  const unit = 26 * scale;
  const minBlock = MIN_BLOCK_UNITS * unit;

  // Breakpoints: every start, every end, every hour mark.
  const marks = {};
  marks[windowStart] = true;
  marks[windowEnd] = true;
  for (let m = Math.ceil(windowStart / 60) * 60; m <= windowEnd; m += 60) {
    marks[m] = true;
  }
  const visible = model.activities.filter(function (a) {
    return !a.background && a.endMin > windowStart && a.startMin < windowEnd;
  });
  visible.forEach(function (a) {
    if (a.startMin > windowStart && a.startMin < windowEnd) marks[a.startMin] = true;
    if (a.endMin > windowStart && a.endMin < windowEnd) marks[a.endMin] = true;
  });

  cuts = Object.keys(marks).map(Number).sort(function (a, b) { return a - b; });

  const indexOfCut = function (minute) {
    let lo = 0, hi = cuts.length - 1;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (cuts[mid] < minute) lo = mid + 1; else hi = mid;
    }
    return lo;
  };

  // Slice heights for a given minutes-to-pixels rate, with each activity
  // guaranteed its minimum.
  const sliceHeights = function (rate) {
    const h = [];
    for (let i = 0; i < cuts.length - 1; i++) {
      h[i] = Math.max(MIN_SLICE_PX, (cuts[i + 1] - cuts[i]) * rate);
    }
    visible.forEach(function (a) {
      const lo = indexOfCut(Math.max(a.startMin, windowStart));
      const hi = indexOfCut(Math.min(a.endMin, windowEnd));
      if (hi <= lo) return;
      let sum = 0;
      for (let i = lo; i < hi; i++) sum += h[i];
      const deficit = minBlock - sum;
      if (deficit > 0) {
        const share = deficit / (hi - lo);
        for (let i = lo; i < hi; i++) h[i] += share;
      }
    });
    return h;
  };

  const total = function (h) {
    let t = 0;
    for (let i = 0; i < h.length; i++) t += h[i];
    return t;
  };

  // Largest rate whose layout still fits the screen.
  let lo = 0, hi = 4, best = sliceHeights(0);
  for (let step = 0; step < 24; step++) {
    const mid = (lo + hi) / 2;
    const h = sliceHeights(mid);
    if (total(h) <= available) { best = h; lo = mid; } else { hi = mid; }
  }

  // If even the compressed layout overflows, shrink it to fit - and record
  // that we had to, so the caller can show less of the day instead.
  const t = total(best);
  const squeeze = t > available ? available / t : 1;

  // Only report a squeeze worth acting on. A day of back-to-back half-hour
  // appointments lands a few per cent under the minimum, which nobody can
  // see; narrowing the window to fix it would hide real appointments. The
  // fallback is for days that miss by a mile, not by a hair.
  mapSqueezed = squeeze < 0.85;

  offsets = [0];
  for (let i = 0; i < best.length; i++) {
    offsets[i + 1] = offsets[i] + best[i] * squeeze;
  }
}

/* Pixel position of a given minute, interpolating inside its slice. */
function yFor(minute) {
  if (!cuts.length) return 0;
  if (minute <= cuts[0]) return offsets[0];
  if (minute >= cuts[cuts.length - 1]) return offsets[offsets.length - 1];
  let lo = 0, hi = cuts.length - 1;
  while (lo < hi - 1) {
    const mid = (lo + hi) >> 1;
    if (cuts[mid] <= minute) lo = mid; else hi = mid;
  }
  const span = cuts[lo + 1] - cuts[lo];
  const frac = span ? (minute - cuts[lo]) / span : 0;
  return offsets[lo] + (offsets[lo + 1] - offsets[lo]) * frac;
}

function paint() {
  if (!model || !model.activities.length) return;

  narrowed = FOLLOW_NOW;
  computeWindow(narrowed);
  measure();
  buildTimeMap(trackHeight);

  // Whole day didn't fit at a readable size - show a window around now.
  if (mapSqueezed && AUTO_NARROW && !narrowed && trackHeight > 200) {
    narrowed = true;
    computeWindow(true);
    buildTimeMap(trackHeight);
  }

  const rail = document.getElementById("rail");
  let railHtml = "";
  const firstHour = Math.ceil(windowStart / 60) * 60;
  for (let m = firstHour; m <= windowEnd; m += 60) {
    railHtml += '<div class="tick" style="top:' +
      yFor(m) + 'px">' + asClock(m) + "</div>";
  }
  rail.innerHTML = railHtml;

  const tracks = document.querySelectorAll(".track");
  model.venues.forEach(function (venue, index) {
    // Only what overlaps the visible window, clipped to its edges so a
    // booking that started earlier still shows as running.
    const inWindow = model.activities.filter(function (a) {
      return a.venueIndex === index &&
        a.endMin > windowStart && a.startMin < windowEnd;
    });

    // Background bands are laid out behind, at full width, and take no
    // part in lane assignment - otherwise an all-day "Not Available" would
    // occupy lane 0 and squeeze every real appointment into half a column.
    const bands = inWindow.filter(function (a) { return a.background; });
    const list = inWindow.filter(function (a) { return !a.background; });
    assignLanes(list);
    bands.forEach(function (a) { a.lane = 0; a.lanes = 1; a.nextInLane = null; });

    tracks[index].innerHTML = bands.concat(list).map(function (a) {
      const from = Math.max(a.startMin, windowStart);
      const to = Math.min(a.endMin, windowEnd);
      const top = yFor(from);

      // A very short booking gets a readable minimum height, but never
      // more than the gap before the next one in its lane - that overlap
      // was what made consecutive short calls collide.
      const natural = yFor(to) - top;
      const nextAt = a.nextInLane === null ? windowEnd : a.nextInLane;
      const ceiling = Math.max(yFor(nextAt) - top - 2, 14);
      const height = a.background
        ? Math.max(natural, 4)
        : Math.max(Math.min(Math.max(natural, 30 * scale), ceiling), 14);

      const width = 100 / a.lanes;
      if (a.background) {
        return '<div class="block is-background" style="' + blockVars(a.venue) +
          "top:" + top + "px;height:" + height + 'px;left:3px;right:3px">' +
          '<div class="band-label">' + escapeHtml(a.title) + "</div></div>";
      }
      return '<div class="block ' + stateFor(a) + densityFor(height) +
        '" style="' + blockVars(a.venue) + "top:" + top + "px;height:" + height +
        "px;left:calc(" + (a.lane * width) + "% + 3px);width:calc(" +
        width + '% - 6px)">' +
        flagHtml(a) +
        '<div class="when">' + asClock(a.startMin) + " – " + asClock(a.endMin) + "</div>" +
        '<div class="what">' + escapeHtml(a.title) + "</div>" +
        (a.detail ? '<div class="detail">' + escapeHtml(a.detail) + "</div>" : "") +
        (SHOW_NAMES && a.staff ? '<div class="who">' + escapeHtml(a.staff) + "</div>" : "") +
        (SHOW_NAMES ? castHtml(a) : "") +
        "</div>";
    }).join("");
  });

  // Hour lines go in first and stay behind the blocks, so a booking's
  // text is never crossed out by the grid.
  const tracksEl = document.getElementById("tracks");
  tracksEl.querySelectorAll(".hairline").forEach(function (n) { n.remove(); });
  for (let m = Math.floor(windowEnd / 60) * 60; m > windowStart; m -= 60) {
    const rule = document.createElement("div");
    rule.className = "hairline";
    rule.style.top = yFor(m) + "px";
    tracksEl.insertBefore(rule, tracksEl.firstChild);
  }

  positionNowLine();
  fitCast();
  paintLater();
  paintAgenda();

  setStatus("Showing " + asClock(windowStart) + "\u2013" + asClock(windowEnd) +
    (narrowed ? " (narrowed)" : "") +
    (lastUpdated === null ? "" : " \u00b7 updated " + asClock(lastUpdated)));
}

/* Calls falling outside the drawn timeline, at either end. They are not
   drawn, but they are still on today's schedule, so they are listed rather
   than lost. Anything merely overlapping an edge is drawn as normal and
   does not appear here. */
function paintLater() {
  const later = document.getElementById("later");
  if (!later) return;

  const byTime = function (a, b) {
    return a.startMin - b.startMin || a.venueIndex - b.venueIndex;
  };
  const before = model.activities
    .filter(function (a) { return a.endMin <= windowStart; }).sort(byTime);
  const after = model.activities
    .filter(function (a) { return a.startMin >= windowEnd; }).sort(byTime);

  if (!before.length && !after.length) {
    later.className = "later";
    later.innerHTML = "";
    return;
  }

  const run = function (label, list) {
    if (!list.length) return "";
    return '<span class="later-label">' + label + "</span>" +
      list.map(function (a) {
        return '<span class="later-item">' +
          '<span class="later-when">' + asClock(a.startMin) + "</span> " +
          escapeHtml(a.title) +
          ' <span class="later-where">' + escapeHtml(a.venue) + "</span></span>";
      }).join("");
  };

  later.className = "later has-items";
  later.innerHTML =
    run("Before " + asClock(windowStart), before) +
    run("After " + asClock(windowEnd), after);
}

function paintAgenda() {
  const ordered = model.activities.slice().sort(function (a, b) {
    return a.startMin - b.startMin || a.venueIndex - b.venueIndex;
  });
  document.getElementById("agenda").innerHTML = ordered.map(function (a) {
    return '<div class="agenda-item ' + stateFor(a) + '">' +
      '<div class="agenda-time">' + asClock(a.startMin) + "<br>" +
      asClock(a.endMin) + '</div><div class="agenda-body">' +
      '<div class="agenda-venue" style="' + venueVars(a.venue) + '">' +
      escapeHtml(a.venue) + "</div>" +
      flagHtml(a) +
      '<div class="agenda-what">' + escapeHtml(a.title) + "</div>" +
      (a.detail ? '<div class="agenda-detail">' + escapeHtml(a.detail) + "</div>" : "") +
      (SHOW_NAMES && a.staff ? '<div class="agenda-who">' + escapeHtml(a.staff) + "</div>" : "") +
      (SHOW_NAMES && a.cast ? '<div class="agenda-cast">' + escapeHtml(a.cast) + "</div>" : "") +
      "</div></div>";
  }).join("");
}

function positionNowLine() {
  const line = document.getElementById("nowline");
  if (!line) return;
  const now = nowMinutes();
  if (now < windowStart || now > windowEnd) { line.hidden = true; return; }
  line.hidden = false;
  line.style.top = yFor(now) + "px";
  const label = document.getElementById("nowtime");
  if (label) label.textContent = asClock(now);
}

function render(next) {
  model = next;

  if (!model.activities.length) {
    document.getElementById("today").textContent = model.dateLabel || "Today";
    document.getElementById("board").innerHTML =
      '<div class="notice"><strong>Nothing booked today.</strong>' +
      "The studios are clear.</div>";
    document.getElementById("agenda").innerHTML = "";
    return;
  }

  windowStart = Math.floor(Math.min.apply(null,
    model.activities.map(function (a) { return a.startMin; })) / 60) * 60;
  windowEnd = Math.ceil(Math.max.apply(null,
    model.activities.map(function (a) { return a.endMin; })) / 60) * 60;
  if (windowEnd - windowStart < 240) windowEnd = windowStart + 240;

  buildShell();
  requestAnimationFrame(paint);
}

/* =====================================================================
   Clock and loading
   ===================================================================== */

function tick() {
  const d = new Date();
  document.getElementById("clock").textContent =
    pad(d.getHours()) + ":" + pad(d.getMinutes());
  if (model && model.activities.length) paint();
}

function setStatus(m) { document.getElementById("status").textContent = m; }

function load() {
  fetch(PROXY_URL, { cache: "no-store" })
    .then(function (r) {
      if (!r.ok) throw new Error("Proxy returned " + r.status);
      return r.text();
    })
    .then(function (html) {
      lastUpdated = nowMinutes();
      render(parseReport(html));
    })
    .catch(function (error) {
      document.getElementById("today").textContent = "Schedule unavailable";
      document.getElementById("board").innerHTML =
        '<div class="notice"><strong>Cannot reach the schedule.</strong>' +
        escapeHtml(error.message) +
        "<br>The proxy may be waking up. This page retries on its own.</div>";
      document.getElementById("agenda").innerHTML = "";
      setStatus("Retrying");
    });
}

if (QS.title) {
  document.getElementById("eyebrow").textContent = QS.title;
  document.title = QS.title;
}

tick();
setInterval(tick, 30000);
load();
setInterval(load, REFRESH_SECONDS * 1000);
window.addEventListener("resize", function () { if (model) paint(); });
</script>
</body>
</html>
